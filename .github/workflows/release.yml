name: Release

# ADR 0035. While changesets are pending on main, opens or updates the release PR, which bumps
# every workspace and writes packages/web/CHANGELOG.md. Whenever the version on main has no tag
# or GitHub Release yet (once that PR is merged, or after a failed run), verifies the build, tags
# vX.Y.Z, and creates the release. The changesets output can't decide this: an empty changeset
# counts as pending. The release PR runs no CI (it is opened with the workflow token), so this
# workflow verifies its commit and reports the result as `verify`, the check main requires.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: released
        run: |
          tag="v$(node -p 'require("./packages/web/package.json").version')"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null && gh release view "$tag" > /dev/null 2>&1
          then echo "done=true" >> "$GITHUB_OUTPUT"
          else echo "done=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # A PR opened with the workflow token runs no CI, so the release is verified before it is tagged.
      - if: steps.released.outputs.done == 'false'
        run: npm run check && npm run typecheck && npm run build
      - if: steps.released.outputs.done == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release
        env:
          GH_TOKEN: ${{ github.token }}
      # After the release step: the action leaves the bumped versions of the next release PR in the working tree.
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          commit-message: Release
          pr-title: Release
          create-github-releases: false
      - if: steps.changesets.outputs.pr-number != ''
        run: |
          git fetch -q origin changeset-release/main
          git checkout -q --force FETCH_HEAD
          state=success
          { npm ci && npm run check && npm run typecheck && npm run build; } || state=failure
          gh api "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" -f state=$state -f context=verify \
            -f description="check, typecheck, and build, run by the Release workflow" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [ "$state" = success ]
        env:
          GH_TOKEN: ${{ github.token }}
