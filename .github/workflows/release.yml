name: Release

# ADR 0035. While changesets are pending on main, opens or updates the release PR, which bumps
# every workspace and writes packages/web/CHANGELOG.md. Once that PR is merged (no changesets
# left), tags vX.Y.Z and creates the GitHub Release; on other pushes that step finds the version
# already released and does nothing.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          commit-message: Release
          pr-title: Release
          create-github-releases: false
      # A PR opened with the workflow token runs no CI, so the release is verified before it is tagged.
      - if: steps.changesets.outputs.has-changesets == 'false'
        run: npm run check && npm run typecheck && npm run build
      - if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release
        env:
          GH_TOKEN: ${{ github.token }}
