name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changeset check compares with origin/main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Changesets (ADR 0035)
        # skipped only for the release PR the Release workflow opens: its branch name alone could be anyone's
        if: github.event_name == 'pull_request' && !(github.head_ref == 'changeset-release/main' && github.event.pull_request.user.login == 'github-actions[bot]')
        run: node .github/scripts/check-changesets.mjs origin/${{ github.base_ref }}
      - run: npm run check
      - run: npm test # the lint rules still report what they should (ADR 0037); the @pts/web output holds every token and mode (ADR 0039)
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build-storybook
      - name: Accessibility of the docs (ADR 0036)
        run: |
          npx playwright install --with-deps chromium
          npm run test-a11y -w @pts/storybook
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/storybook/dist

  # The generated Kotlin compiles (ADR 0058): a text test can't see what the compiler does (ADR 0057). Builds
  # @pts/android, publishes it to the runner's mavenLocal as a library, and builds the demo app against it.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @pts/android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6 # also validates the Gradle wrappers
      - run: ./gradlew publishToMavenLocal
        working-directory: packages/android
      - run: ./gradlew assembleDebug
        working-directory: apps/android-demo

  # The generated Swift compiles (ADR 0069), which only Xcode on macOS can check: builds @pts/ios, compiles the package
  # for the iOS Simulator, and builds the demo app against it. Needs Xcode 26 or later (iOS 26, Swift tools 6.2).
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: xcodebuild -version
      - run: npm run compile -w @pts/ios
      - run: xcodebuild -project PtsDemo.xcodeproj -scheme PtsDemo -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet build
        working-directory: apps/ios-demo

  # The docs on GitHub Pages show main (ADR 0020): deployed only after verify passes on a push.
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    concurrency: pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
