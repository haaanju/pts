name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test # the lint rules still report what they should (ADR 0037); the @pts/web output holds every token and mode (ADR 0039)
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build-storybook
      - name: Accessibility of the docs (ADR 0036)
        run: |
          npx playwright install --with-deps chromium
          npm run test-a11y -w @pts/storybook
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/storybook/dist

  # The docs on GitHub Pages show main (ADR 0020): deployed only after verify passes on a push.
  deploy:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    concurrency: pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
